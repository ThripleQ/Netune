name: Build

permissions:
  contents: write

on:
  push:
    branches: [ master, beta ]
    tags: [ "v*", "1.*", "2.*" ]
  release:
    types: [ published ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake pkg-config \
            libasound2-dev libpulse-dev libsdl2-dev \
            libavformat-dev libavcodec-dev libswresample-dev \
            libyaml-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Strip
        run: strip build/netune

      - name: Package netease-cli
        run: |
          cd src/plugins/music_sources/netease/netease-cli
          go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/build/netease-cli" .
          cd "$GITHUB_WORKSPACE"
          tar czf netease-cli-linux-x86_64.tar.gz -C build netease-cli

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: netune-linux
          path: |
            build/netune
            build/netease-cli

      - name: Upload netease-cli
        uses: actions/upload-artifact@v4
        with:
          name: netease-cli-linux
          path: netease-cli-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/packages
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Configure (vcpkg manifest mode auto-installs deps)
        run: |
          # Let cmake auto-detect the generator; windows-latest has
          # Visual Studio installed and setup-msbuild adds it to PATH.
          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build netune
        run: cmake --build build --config Release -j

      - name: Collect DLLs
        run: |
          # Manifest mode installs to <build>/vcpkg_installed/<triplet>/bin
          $bin = "$pwd\build\vcpkg_installed\x64-windows\bin"
          if (-not (Test-Path $bin)) {
            $bin = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          }
          Write-Host "Collecting DLLs from: $bin"
          $dlls = @()
          foreach ($pattern in @("avformat*.dll","avcodec*.dll","avutil*.dll",
                                  "swresample*.dll","SDL2*.dll","yyjson*.dll","yaml*.dll")) {
            $found = Get-ChildItem -Path $bin -Filter $pattern -ErrorAction SilentlyContinue
            if ($found) { $dlls += $found }
          }
          if ($dlls.Count -eq 0) {
            Write-Host "WARNING: No DLLs found in $bin"
            Get-ChildItem -Path $bin -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          Copy-Item $dlls -Destination build\Release\ -ErrorAction SilentlyContinue

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: netune-windows
          path: build\Release\*

      - name: Package netease-cli
        run: |
          cd src/plugins/music_sources/netease/netease-cli
          go build -ldflags="-s -w" -o "$env:GITHUB_WORKSPACE\build\netease-cli.exe" .
          cd "$env:GITHUB_WORKSPACE"
          Compress-Archive -Path build\netease-cli.exe -DestinationPath netease-cli-windows-x86_64.zip -Force

      - name: Upload netease-cli
        uses: actions/upload-artifact@v4
        with:
          name: netease-cli-windows
          path: netease-cli-windows-x86_64.zip

  release:
    if: github.event_name == 'release'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Package
        run: |
          cd netune-linux && tar czf ../netune-linux.tar.gz * && cd ..
          cd netune-windows && zip -r ../netune-windows.zip * && cd ..
          cp netease-cli-linux/netease-cli-linux-x86_64.tar.gz .
          cp netease-cli-windows/netease-cli-windows-x86_64.zip .

      - name: Upload to release
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            netune-linux.tar.gz
            netune-windows.zip
            netease-cli-linux-x86_64.tar.gz
            netease-cli-windows-x86_64.zip
